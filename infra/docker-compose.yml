services:
  db:
    image: postgres:16-alpine
    container_name: inventory-db
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-inventory}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: inventory-api
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      VISION_SERVICE_URL: ${VISION_SERVICE_URL:-http://vision:8001}
    ports:
      - "${API_PORT:-8003}:8000"
    volumes:
      - ../apps/api:/app
      - api_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  vision:
    build:
      context: ../services/vision
      dockerfile: Dockerfile
    container_name: inventory-vision
    ports:
      - "${VISION_PORT:-8001}:8001"
    volumes:
      - ../services/vision:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: inventory-web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8003}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ../apps/web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  api_storage:
